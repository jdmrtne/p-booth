<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>p-booth — Choose Your Layout</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="screen-orientation" content="portrait">
  <meta name="theme-color" content="#ff6b9d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="p-booth">
  <link rel="apple-touch-icon" href="icon-192.svg">

  <!-- SEO / Social -->
  <meta name="description" content="Korean-style 인생네컷 photo booth — choose a layout, take photos, download your strip.">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <header class="site-header">
    <h1><span class="highlight">p-booth</span></h1>
    <p class="subtitle">Korean-style photo booth experience</p>
    <div class="header-rule"></div>
  </header>

  <div class="steps">
    <div class="step active"><div class="step-num">1</div><span>Layout</span></div>
    <div class="divider"></div>
    <div class="step"><div class="step-num">2</div><span>Capture</span></div>
    <div class="divider"></div>
    <div class="step"><div class="step-num">3</div><span>Download</span></div>
  </div>

  <main class="page-wrapper">
    <div class="section-head fade-in">
      <h2>Select a Layout</h2>
      <p>Choose your photo strip format — then customize your strip on the next page!</p>
    </div>

    <div id="layoutGrid" class="layout-grid stagger"></div>

  </main>

  <script src="js/orientation-lock.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <script src="js/install-banner.js"></script>
</body>
</html>
