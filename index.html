<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>p-booth — Choose Your Layout</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b9d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="p-booth">
  <link rel="apple-touch-icon" href="icon-192.svg">

  <!-- SEO / Social -->
  <meta name="description" content="Korean-style 인생네컷 photo booth — choose a layout, take photos, download your strip.">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ─── LANDSCAPE GATE (all pages) ─── -->
  <div class="landscape-gate" id="landscapeGate">
    <div class="lg-phone-wrap">
      <div class="lg-phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:2.4rem;height:2.4rem;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <div class="lg-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:1.3rem;height:1.3rem;"><path d="M21.5 2v6h-6"/><path d="M2.5 12a10 10 0 0 1 17-7.1L21.5 8"/></svg></div>
    </div>
    <div class="lg-title">Landscape Recommended</div>
    <p class="lg-sub">p-booth looks best in landscape — rotate your phone for the full experience</p>
    <div class="lg-badge"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 12a10 10 0 0 1 17-7.1L21.5 8"/></svg> Landscape mode recommended</div>
    <div class="landscape-gate-actions">
      <button class="landscape-gate-dismiss" onclick="dismissLandscapeGate()">Continue in Portrait →</button>
    </div>
  </div>

  <header class="site-header">
    <h1><span class="highlight">p-booth</span></h1>
    <p class="subtitle">Korean-style photo booth experience</p>
    <div class="header-rule"></div>
  </header>

  <div class="steps">
    <div class="step active"><div class="step-num">1</div><span>Layout</span></div>
    <div class="divider"></div>
    <div class="step"><div class="step-num">2</div><span>Capture</span></div>
    <div class="divider"></div>
    <div class="step"><div class="step-num">3</div><span>Download</span></div>
  </div>

  <main class="page-wrapper">
    <div class="section-head fade-in">
      <h2>Select a Layout</h2>
      <p>Choose your photo strip format — then customize your strip on the next page!</p>
    </div>

    <div id="layoutGrid" class="layout-grid stagger"></div>

  </main>

  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script>
    // ── Landscape gate (soft — dismissable) ──
    let _gateDismissed = false;
    function isMobileTouch() {
      return ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth <= 900;
    }
    function isPortrait() {
      if (screen.orientation?.type) return screen.orientation.type.startsWith('portrait');
      return window.innerHeight > window.innerWidth;
    }
    function checkLandscape() {
      const gate = document.getElementById('landscapeGate');
      if (!gate || _gateDismissed) return;
      gate.classList.toggle('visible', isMobileTouch() && isPortrait());
    }
    function dismissLandscapeGate() {
      _gateDismissed = true;
      const gate = document.getElementById('landscapeGate');
      if (gate) gate.classList.remove('visible');
    }
    checkLandscape();
    window.addEventListener('resize', checkLandscape);
    window.addEventListener('orientationchange', () => setTimeout(checkLandscape, 300));
    if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(checkLandscape, 300));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <script src="js/install-banner.js"></script>
</body>
</html>
