<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>p-booth — Your Strip</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b9d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="p-booth">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    main { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: stretch; }
    .result-layout { flex: 1; min-height: 0; overflow: hidden; }
    .strip-frame   { overflow: hidden; }
    .strip-frame canvas { max-height: 100%; max-width: 100%; }
  </style>
</head>
<body>

  <nav class="top-bar">
    <a class="top-bar-logo" href="index.html">p-booth</a>
    <div class="top-bar-steps">
      <div class="step done"><div class="step-num">✓</div><span>Layout</span></div>
      <div class="divider"></div>
      <div class="step done"><div class="step-num">✓</div><span>Capture</span></div>
      <div class="divider"></div>
      <div class="step active"><div class="step-num">3</div><span>Download</span></div>
    </div>
    <div class="top-bar-right">
      <a class="top-bar-back" href="camera.html" onclick="return confirmBack()">← Rearrange</a>
    </div>
  </nav>

  <main>
    <div class="result-layout">

      <div class="section-head fade-in" style="margin:0;">
        <h2 id="resultHeading">Your Photo Strip</h2>
        <p id="resultSub">Looking great! Save it before it disappears ✨</p>
      </div>

      <div class="processing-state" id="processingState">
        <div class="spinner"></div>
        <p>Developing your film… ♡</p>
      </div>

      <div class="strip-frame fade-in hidden" id="stripFrame">
        <canvas id="resultCanvas"></canvas>
      </div>

      <div class="result-sidebar hidden" id="resultSidebar">
        <p class="confetti-msg" id="successMsg">✨ Save it, share it, stick it on everything!</p>
        <div class="result-actions" id="resultActions">
          <button class="btn btn-primary btn-lg" id="downloadBtn" onclick="downloadStrip()">
            ⬇ Download PNG
          </button>
          <button class="btn btn-secondary result-rearrange-btn btn-lg" onclick="goBackToRearrange()">
            ⟺ Rearrange Photos
          </button>
          <button class="btn btn-purple btn-lg" onclick="retakePhotos()">
            ↺ Retake Photos
          </button>
          <a class="btn btn-ghost btn-lg" href="index.html">
            ⊞ New Layout
          </a>
        </div>
      </div>

      <div class="hidden" id="errorState" style="text-align:center;padding:40px;">
        <div style="font-size:2.5rem;margin-bottom:16px;">📂</div>
        <p style="color:var(--text-muted);font-size:.82rem;font-weight:700;margin-bottom:20px;">
          No photos found. Please complete a capture session first.
        </p>
        <a href="index.html" class="btn btn-primary">← Choose a Layout</a>
      </div>

    </div>
  </main>

  <script src="js/canvas.js"></script>
  <script>
    const LAYOUTS_RES = {
      CUT4:  { id:'CUT4',  name:'Classic 4-Cut', kr:'인생4컷',    shots:4, format:'4 × 1 strip', cols:1, rows:4, type:'strip',       accentColor:'#ff6b9d' },
      CUT2:  { id:'CUT2',  name:'2-Cut Wide',    kr:'인생2컷',    shots:2, format:'2 × 1 strip', cols:1, rows:2, type:'strip',       accentColor:'#a855f7' },
      WIDE4: { id:'WIDE4', name:'Wide 4-Cut',    kr:'4컷 와이드', shots:4, format:'2×2 grid',    cols:2, rows:2, type:'grid2x2',     accentColor:'#2dd4bf' },
      CUT8:  { id:'CUT8',  name:'Double Strip',  kr:'인생8컷',    shots:8, format:'2 strips × 4',cols:2, rows:4, type:'doublestrip', accentColor:'#fbbf24' },
    };

    let generatedCanvas = null;
    let currentLayout   = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const layoutId   = sessionStorage.getItem('photobooth_layout');
      const photosJson = sessionStorage.getItem('photobooth_photos');

      if (!layoutId || !photosJson || !LAYOUTS_RES[layoutId]) { showError(); return; }
      currentLayout = LAYOUTS_RES[layoutId];

      let photos;
      try { photos = JSON.parse(photosJson); } catch { showError(); return; }
      if (!photos?.length) { showError(); return; }

      document.getElementById('resultHeading').textContent = `Your ${currentLayout.name} Strip`;
      document.getElementById('resultSub').textContent =
        `${photos.filter(Boolean).length} photos · ${currentLayout.kr} · ${currentLayout.format}`;

      try {
        generatedCanvas = await generatePhotoStrip(photos, currentLayout);

        // ── Apply stickers saved from camera.html ──────────────────
        const stickersRaw = sessionStorage.getItem('photobooth_stickers');
        if (stickersRaw) {
          try {
            const stickerData = JSON.parse(stickersRaw);
            if (stickerData && stickerData.length > 0) {
              await applyStickersToCanvas(generatedCanvas, stickerData);
            }
          } catch(e) { console.warn('Sticker apply failed:', e); }
        }

        const rc = document.getElementById('resultCanvas');
        rc.width  = generatedCanvas.width;
        rc.height = generatedCanvas.height;
        rc.getContext('2d').drawImage(generatedCanvas, 0, 0);
        showResult();
      } catch(err) {
        console.error(err); showError();
      }
    });

    // ── STICKER RENDERING ─────────────────────────────────────────────
    // Each sticker is stored as fractions of the canvas dimensions.
    // We draw each emoji at the correct scaled position using canvas 2D.
    function applyStickersToCanvas(canvas, stickers) {
      return new Promise(resolve => {
        const ctx = canvas.getContext('2d');
        const cw  = canvas.width;
        const ch  = canvas.height;

        stickers.forEach(stk => {
          const cx   = stk.xFrac    * cw;
          const cy   = stk.yFrac    * ch;
          const size = stk.sizeFrac * cw;
          const rot  = (stk.rotation || 0) * Math.PI / 180;

          ctx.save();
          ctx.globalAlpha  = 1;          // ← ensure full opacity regardless of prior ctx state
          ctx.fillStyle    = '#000000';  // ← reset fillStyle alpha that drawFooter leaves behind
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          ctx.font         = `${size}px serif`;
          ctx.textAlign    = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(stk.emoji, 0, 0);
          ctx.restore();
        });

        resolve();
      });
    }

    function showResult() {
      document.getElementById('processingState').classList.add('hidden');
      document.getElementById('stripFrame').classList.remove('hidden');
      document.getElementById('resultSidebar').classList.remove('hidden');
    }
    function showError() {
      document.getElementById('processingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
    }

    function downloadStrip() {
      if (!generatedCanvas) return;
      const btn = document.getElementById('downloadBtn');
      btn.textContent = '✓ Saved!';
      btn.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
      setTimeout(() => { btn.innerHTML = '⬇ Download PNG'; btn.style.background = ''; }, 2000);
      const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
      downloadCanvas(generatedCanvas, `pbooth-${currentLayout?.id || 'strip'}-${ts}.png`);
    }

    // Return to camera.html which will detect existing photos and show rearrange view
    function goBackToRearrange() {
      window.location.href = 'camera.html';
    }

    function confirmBack() {
      // sessionStorage still holds photos — camera.html will show rearrange view
      return true;
    }

    function retakePhotos() {
      sessionStorage.removeItem('photobooth_photos');
      sessionStorage.removeItem('photobooth_photos_idb');
      window.location.href = 'camera.html';
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
